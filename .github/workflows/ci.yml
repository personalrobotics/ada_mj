name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job reads the repository and nothing more. Actions are pinned by commit.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest -v
        env:
          ADA_ARTIFACTS: ${{ github.workspace }}/artifacts

      # Prove the wheel stands alone, outside the checkout.
      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel in a clean environment
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/requirements.txt"
          uv venv "$RUNNER_TEMP/clean" --python 3.13
          uv pip install --python "$RUNNER_TEMP/clean" -r "$RUNNER_TEMP/requirements.txt" dist/ada_mj-*.whl

      - name: Check the installed wheel and run its command
        working-directory: ${{ runner.temp }}
        run: |
          PY="$RUNNER_TEMP/clean/bin/python"
          "$PY" -I "$GITHUB_WORKSPACE/scripts/check_boundary.py"
          "$RUNNER_TEMP/clean/bin/ada-lift" --seed 0 --record installed-run
          "$PY" -I -c "import json, sys; r = json.load(open('installed-run/lift.json')); sys.exit(0 if r['privileged']['held'] else 'not held')"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -r installed-run "$GITHUB_WORKSPACE/artifacts/installed-run"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ada-mj-evidence
          path: artifacts/
