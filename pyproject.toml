[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ada-mj"
version = "0.1.0"
description = "MuJoCo simulation and mj_manipulator integration for the ADA robot-assisted feeding system"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Siddhartha Srinivasa", email = "siddhartha.srinivasa@gmail.com"},
]
requires-python = ">=3.11"  # ssik (transitive via JACO 2 IK) requires 3.11+
dependencies = [
    "numpy",
    "mujoco",
    "ssik>=1.1.0",
    "ipython>=8.0",
    "ada-assets @ git+https://github.com/personalrobotics/ada_assets.git",
    "mj-manipulator @ git+https://github.com/personalrobotics/mj_manipulator.git",
    "mj-environment @ git+https://github.com/personalrobotics/mj_environment.git",
    "mj-viser @ git+https://github.com/personalrobotics/mj_viser.git",
    "prl-assets @ git+https://github.com/personalrobotics/prl_assets.git",
    "tsr @ git+https://github.com/personalrobotics/tsr.git",
    "viser>=1.0",
]

[tool.uv.sources]
ada-assets = { workspace = true }
mj-manipulator = { workspace = true }
mj-environment = { workspace = true }
mj-viser = { workspace = true }
prl-assets = { workspace = true }
tsr = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ada_mj"]

[project.urls]
Homepage = "https://github.com/personalrobotics/ada_mj"
Repository = "https://github.com/personalrobotics/ada_mj"
Issues = "https://github.com/personalrobotics/ada_mj/issues"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: integration tests that load the full MuJoCo model and plan (deselect with '-m \"not slow\"')",
]
